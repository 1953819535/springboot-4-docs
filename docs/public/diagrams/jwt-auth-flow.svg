<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" {W}>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b1f1c"/></marker></defs>
  <rect width="1200" height="675" fill="#fafafa"/>

  <text x="60" y="52" font-size="20" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">无状态 JWT 认证时序（OAuth2 Resource Server）</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#d3d6da"/>
  <rect x="60" y="110" width="240" height="64" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="180.0" y="138.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">客户端</text><text x="180.0" y="156.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">携带 Bearer Token</text>
  <rect x="480" y="110" width="240" height="64" rx="4" fill="#eef4e6" stroke="#4e8a2e" stroke-width="1.2"/><text x="600.0" y="138.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">Spring Security 过滤链</text><text x="600.0" y="156.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">JwtAuthenticationProvider</text>
  <rect x="900" y="110" width="240" height="64" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="1020.0" y="138.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">授权服务器</text><text x="1020.0" y="156.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">JWKS 端点 (issuer-uri)</text>
  <line x1="300" y1="142" x2="480" y2="142" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/><text x="390.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">① 请求 Authorization: Bearer <jwt></text>
  <line x1="720" y1="142" x2="900" y2="142" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/><text x="810.0" y="136.0" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">② 首次启动拉取公钥 (JWKS)，本地验签</text>
  <rect x="480" y="240" width="240" height="64" rx="4" fill="#eef4e6" stroke="#4e8a2e" stroke-width="1.2"/><text x="600.0" y="268.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">签名 / aud / 过期校验</text><text x="600.0" y="286.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">全部本地完成，无网络往返</text>
  <line x1="600" y1="174" x2="600" y2="240" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="480" y="370" width="240" height="64" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="600.0" y="398.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">角色映射 Converter</text><text x="600.0" y="416.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">claims.roles → ROLE_x</text>
  <line x1="600" y1="304" x2="600" y2="370" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="480" y="500" width="240" height="64" rx="4" fill="#eef4e6" stroke="#4e8a2e" stroke-width="1.2"/><text x="600.0" y="528.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">SecurityFilterChain 授权</text><text x="600.0" y="546.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">requestMatchers / hasRole</text>
  <line x1="600" y1="434" x2="600" y2="500" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="60" y="500" width="240" height="64" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="180.0" y="528.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">Controller 业务方法</text><text x="180.0" y="546.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">或 @PreAuthorize 二次闸</text>
  <line x1="480" y1="532" x2="300" y2="532" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/><text x="390.0" y="526.0" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">③ 放行</text>
  <rect x="900" y="500" width="240" height="64" rx="4" fill="#fdf2f2" stroke="#c0392b" stroke-width="1.2"/><text x="1020.0" y="528.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">401 / 403</text><text x="1020.0" y="546.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">验签失败或角色不足</text>
  <line x1="720" y1="532" x2="900" y2="532" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr)"/><text x="810.0" y="526.0" text-anchor="middle" font-size="10.5" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">拒绝</text>
  <text x="60" y="630" font-size="12" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">要点：验签全在本地（ issuer-uri 只在启动时发现 JWKS）；audiences 校验防跨服务误用；会话 STATELESS 不落地。</text>
