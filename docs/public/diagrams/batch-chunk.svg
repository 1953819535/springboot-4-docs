<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" {W}>
  <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1b1f1c"/></marker></defs>
  <rect width="1200" height="675" fill="#fafafa"/>

  <text x="60" y="52" font-size="20" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">Spring Batch chunk 执行模型（读 100 → 处理 → 写 100 → 提交）</text>
  <line x1="60" y1="66" x2="1140" y2="66" stroke="#d3d6da"/>
  <rect x="60" y="100" width="190" height="60" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="155.0" y="126.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">ItemReader</text><text x="155.0" y="144.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">逐条读入（流式）</text>
  <rect x="320" y="100" width="190" height="60" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="415.0" y="126.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">ItemProcessor</text><text x="415.0" y="144.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">校验/转换，null=过滤</text>
  <rect x="580" y="100" width="190" height="60" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="675.0" y="126.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">ItemWriter</text><text x="675.0" y="144.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">整块批量写出</text>
  <rect x="840" y="100" width="190" height="60" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="935.0" y="126.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">事务提交</text><text x="935.0" y="144.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">每 chunk 一次</text>
  <line x1="250" y1="130" x2="320" y2="130" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="510" y1="130" x2="580" y2="130" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="770" y1="130" x2="840" y2="130" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="60" y="210" width="970" height="88" rx="4" fill="#eef4e6" stroke="#4e8a2e" stroke-width="1"/>
  <text x="80" y="238" font-size="12.5" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">容错策略（faultTolerant）：</text>
  <text x="80" y="262" font-size="12" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">retry(DataAccessException, limit 3) —— 数据库抖动自动重试同一 chunk</text>
  <text x="80" y="284" font-size="12" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">skip(ValidationException, limit 50) —— 脏数据按条跳过并计入跳过表，超限判定 Step 失败</text>
  <rect x="60" y="350" width="300" height="64" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="210.0" y="378.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">JobRepository 元数据</text><text x="210.0" y="396.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">JobInstance / StepExecution 状态</text>
  <rect x="460" y="350" width="300" height="64" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="610.0" y="378.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">JobParameters</text><text x="610.0" y="396.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">日期等参数变化才能重跑</text>
  <rect x="860" y="350" width="280" height="64" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="1000.0" y="378.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">启动即执行</text><text x="1000.0" y="396.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">单 Job Bean 自动 Launcher</text>
  <line x1="215" y1="298" x2="215" y2="350" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="610" y1="298" x2="610" y2="350" stroke="#1b1f1c" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="60" y="480" width="490" height="120" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="305.0" y="536.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">失败续跑</text><text x="305.0" y="554.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">同参数 JobInstance 已 SUCCESS 会被跳过；
换参数（日期）即新实例，从断点继续</text>
  <rect x="640" y="480" width="500" height="120" rx="4" fill="white" stroke="#4e8a2e" stroke-width="1.2"/><text x="890.0" y="536.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1f1c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">生产红线</text><text x="890.0" y="554.0" text-anchor="middle" font-size="11" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">元数据表先建（脚本随 spring-batch-core）；
@EnableBatchProcessing 会让自动配置退位，默认不加</text>
  <text x="60" y="630" font-size="12" fill="#6b7280" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">要点：chunk 大小是事务边界——1 条脏数据默认回滚整块；大文件用流式 Reader，避免全量进内存。</text>
